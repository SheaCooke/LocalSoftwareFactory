            # todo

            A tiny command-line todo list. Items are kept as JSON in `$TODO_FILE`
            (default `~/.todo.json`). Python 3.10+, no dependencies.

            ## Usage

            ```powershell
            $env:PYTHONPATH = "src"     # or: pip install -e .
            python -m todo add "buy milk"
            python -m todo list         # 1 [ ] buy milk
            python -m todo done 1
            ```

