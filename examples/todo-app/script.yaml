          content: |
            """Tests for the todo CLI (written before the implementation exists)."""

            import json

            import pytest

            from todo.cli import main


            @pytest.fixture
            def db(tmp_path, monkeypatch):
                path = tmp_path / "todos.json"
                monkeypatch.setenv("TODO_FILE", str(path))
                return path


            def test_add_and_list(db, capsys):
                """AC-1.1, AC-2.1"""
                assert main(["add", "buy milk"]) == 0
                assert main(["add", "walk dog"]) == 0
                capsys.readouterr()
                assert main(["list"]) == 0
                out = capsys.readouterr().out
                assert "1 [ ] buy milk" in out
                assert "2 [ ] walk dog" in out


            def test_list_empty(db, capsys):
                """AC-2.2"""
                assert main(["list"]) == 0
                assert "no todos" in capsys.readouterr().out


            def test_done_marks_item(db, capsys):
                """AC-3.1"""
                main(["add", "buy milk"])
                assert main(["done", "1"]) == 0
                capsys.readouterr()
                main(["list"])
                assert "1 [x] buy milk" in capsys.readouterr().out


            def test_persists_as_json(db):
                """AC-4.1"""
                main(["add", "x"])
                assert json.loads(db.read_text(encoding="utf-8"))[0]["text"] == "x"
