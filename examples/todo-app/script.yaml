# Scripted LLM transcript for the default pipeline building a CLI todo app.
#
# Used by the end-to-end test (tests/test_e2e_todo.py) and by the offline `demo`
# model alias, so you can watch a whole run in the UI without an API key:
#
#   uv run factory run start "A CLI todo app with add, list and done commands" --model demo
#
# Entries are consumed in order per agent (match.agent). The run deliberately takes
# the scenic route: the first implementation fails the `pytest -q` check gate and is
# retried with the failures as feedback; the reviewer then finds a crash and sends
# the work back (goto implement); along the way agents try to touch files outside
# their scope and are denied.

# ------------------------------------------------------------------ requirements
- match: { agent: requirements }
  response:
    content: |
      # Requirements: CLI todo list

      ## Goal
      A single-user command-line todo list that keeps items between runs.

      ## Actors
      - A developer working in a terminal.

      ## Functional requirements
      ### FR-1 Add
      `todo add "<text>"` appends a new, not-done item with the next id (1, 2, ...).
      **Acceptance criteria**
      - AC-1.1 Given an empty list, When I run `todo add "buy milk"`, Then item 1 "buy milk" exists and is not done.

      ### FR-2 List
      `todo list` prints one line per item: `<id> [ ] <text>` or `<id> [x] <text>`.
      **Acceptance criteria**
      - AC-2.1 Given items 1 "buy milk" and 2 "walk dog", When I list, Then the output contains `1 [ ] buy milk` and `2 [ ] walk dog`.
      - AC-2.2 Given no items, When I list, Then the output says `no todos`.

      ### FR-3 Done
      `todo done <id>` marks the item done.
      **Acceptance criteria**
      - AC-3.1 Given item 1, When I run `todo done 1`, Then listing shows `1 [x] buy milk`.
      - AC-3.2 Given no item 99, When I run `todo done 99`, Then the exit code is 1 and stderr says `error: no todo with id 99`.

      ### FR-4 Persistence
      Items are stored as JSON in `$TODO_FILE`, defaulting to `~/.todo.json`.
      **Acceptance criteria**
      - AC-4.1 Given `TODO_FILE` is set, When I add an item, Then that file contains a JSON list with the item.

      ## Non-functional requirements
      - NFR-1 Python 3.10+, standard library only; works on Windows and Linux.

      ## In scope / Out of scope
      In: add, list, done. Out: delete, priorities, due dates, sync.

      ## Assumptions
      - Ids are never reused within a list.

      ## Open questions
      - None for the first version.

# ----------------------------------------------------------------------- design
- match: { agent: architect }
  response:
    content: |
      # Design: CLI todo list

      ## Overview
      One package, `todo`, with an argparse CLI over a JSON file.

      ## Technology choices
      - Python 3.10+, standard library only (argparse, json, pathlib). Tests: pytest.

      ## Project layout
      ```
      pyproject.toml          # pytest config: pythonpath = ["src"]
      src/todo/__init__.py
      src/todo/__main__.py    # python -m todo
      src/todo/cli.py         # main(argv) -> int
      tests/test_todo.py
      ```

      ## Components
      ### todo.cli (covers FR-1..FR-4)
      ```python
      def main(argv: list[str] | None = None) -> int: ...
      def store_path() -> Path: ...   # $TODO_FILE or ~/.todo.json
      ```
      Items are `{"id": int, "text": str, "done": bool}` in a JSON list.

      ## Error handling
      Unknown id: print `error: no todo with id <id>` to stderr, return 1.

      ## Test strategy
      `pytest -q`; tests call `main([...])` with `TODO_FILE` pointed at a temp file.

      ## Traceability
      | FR | Interface |
      |---|---|
      | FR-1..FR-3 | `todo.cli.main` subcommands add / list / done |
      | FR-4 | `todo.cli.store_path`, JSON file |

# ------------------------------------------------------------------------- plan
- match: { agent: planner }
  response:
    content: |
      # Plan: CLI todo list

      ## Tasks
      ### T1 Scaffold
      - Files: pyproject.toml, src/todo/__init__.py, src/todo/__main__.py
      - Done when: `python -m todo --help` works.
      ### T2 Storage + add/list/done
      - Files: src/todo/cli.py
      - Satisfies: AC-1.1, AC-2.1, AC-2.2, AC-3.1, AC-3.2, AC-4.1
      - Done when: tests/test_todo.py passes.

      ## Test checklist
      - tests/test_todo.py::test_add_and_list → AC-1.1, AC-2.1
      - tests/test_todo.py::test_list_empty → AC-2.2
      - tests/test_todo.py::test_done_marks_item → AC-3.1
      - tests/test_todo.py::test_persists_as_json → AC-4.1

      ## Risks
      - AC-3.2 (unknown id) has no automated test in the checklist; review must check it.

