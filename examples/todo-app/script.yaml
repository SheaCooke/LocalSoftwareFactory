# --------------------------------------- implementer, after review (loop back)
- match: { agent: implementer }
  response:
    tool_calls:
      - name: fs.write
        arguments:
          path: src/todo/cli.py
          content: |
            """Command-line todo list: add, list and done."""

            from __future__ import annotations

            import argparse
            import json
            import os
            import sys
            from pathlib import Path


            def store_path() -> Path:
                """Where todos are kept: $TODO_FILE, or ~/.todo.json."""
                return Path(os.environ.get("TODO_FILE") or Path.home() / ".todo.json")


            def load(path: Path) -> list[dict]:
                if not path.exists():
                    return []
                return json.loads(path.read_text(encoding="utf-8"))


            def save(path: Path, todos: list[dict]) -> None:
                path.parent.mkdir(parents=True, exist_ok=True)
                path.write_text(json.dumps(todos, indent=2), encoding="utf-8")


            def main(argv: list[str] | None = None) -> int:
                parser = argparse.ArgumentParser(prog="todo", description="A tiny todo list.")
                sub = parser.add_subparsers(dest="command", required=True)
                sub.add_parser("add", help="add a todo").add_argument("text")
                sub.add_parser("list", help="list todos")
                sub.add_parser("done", help="mark a todo as done").add_argument("id", type=int)
                args = parser.parse_args(argv)

                path = store_path()
                todos = load(path)
                if args.command == "add":
                    todos.append({"id": len(todos) + 1, "text": args.text, "done": False})
                    save(path, todos)
                    print(f"added {len(todos)}: {args.text}")
                elif args.command == "list":
                    if not todos:
                        print("no todos")
                    for item in todos:
                        mark = "x" if item["done"] else " "
                        print(f"{item['id']} [{mark}] {item['text']}")
                else:
                    match = next((t for t in todos if t["id"] == args.id), None)
                    if match is None:
                        print(f"error: no todo with id {args.id}", file=sys.stderr)
                        return 1
                    match["done"] = True
                    save(path, todos)
                    print(f"done {args.id}")
                return 0
