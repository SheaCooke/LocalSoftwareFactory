# Global factory settings. Hot-reloaded; changes apply to the next LLM call.
#
# Runtime model switches made from the UI or `factory model use` are written to
# config/overrides.yaml (machine-managed, git-ignored), which takes precedence
# over default_model / agent_overrides here. `factory model reset` clears it.

default_model: echo          # alias from models.yaml

# Per-agent model overrides (agent name -> alias). Beats the agent.md `model:`.
agent_overrides: {}
#  implementer: local-coder

ui:
  host: 127.0.0.1            # loopback only; anything else is rejected
  port: 8765
  open_browser: true

paths:                       # relative to the repository root
  agents: agents
  runs: runs
  workspaces: workspaces
  pipelines: config/pipelines

limits:
  max_parallel_agents: 4            # branches of a parallel stage run concurrently up to this
  network_approval_timeout_s: 600   # an L3 agent waits this long for network approval

sandbox:
  backend: auto              # auto | docker | subprocess (auto: Docker if ready, else subprocess)
  image: software-factory-sandbox:py312   # built by `factory sandbox build`
  cpus: 2.0
  memory: 2g
  pids_limit: 256
  timeout_s: 300
  # Executables the restricted-subprocess fallback may launch (no Docker). Keep this
  # short: no shells, package managers or git (they can reach the network or escape).
  command_allowlist: [python, pytest, ruff, mypy]

budgets:                     # null = unlimited; exceeding pauses the run for approval
  per_run_tokens: 2000000
  per_run_cost_usd: 20.0
  per_stage_tokens: 500000
  per_stage_cost_usd: null
